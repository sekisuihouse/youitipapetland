<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陽一パペットランド 最終話</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111;
      --panel: #202020;
      --panel-2: #2b2b2b;
      --text: #f5f5f5;
      --muted: #b8b8b8;
      --line: #444;
      --accent: #44d28f;
      --shadow: rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 0, rgba(255, 255, 255, 0.08), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      padding: 14px clamp(12px, 2.4vw, 28px) 18px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
    }

    h1 {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: clamp(20px, 3vw, 34px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .counter {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .pdf-button,
    .nav-button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
      min-height: 44px;
      padding: 0 16px;
      white-space: nowrap;
    }

    .pdf-button:hover:not(:disabled),
    .nav-button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    .pdf-button:disabled,
    .nav-button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .stage {
      position: relative;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.1), transparent 52%),
        #080808;
      box-shadow: 0 22px 68px var(--shadow);
      perspective: 1800px;
    }

    .book {
      position: relative;
      width: min(94vw, calc(78vh * 1.42), 1180px);
      height: min(78vh, calc(94vw / 1.42), 830px);
      transform-style: preserve-3d;
    }

    .book.ending-book {
      width: min(76vw, calc(78vh * 0.67), 560px);
      height: min(78vh, calc(76vw / 0.67), 840px);
    }

    .spread {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border-radius: 4px;
      background: #fbfbfb;
      box-shadow:
        0 2px 0 rgba(255, 255, 255, 0.56) inset,
        0 -22px 28px rgba(0, 0, 0, 0.12) inset,
        0 22px 48px var(--shadow);
      backface-visibility: hidden;
    }

    .spread.cover {
      left: 25%;
      right: 25%;
      grid-template-columns: 1fr;
    }

    .spread.ending {
      left: 0;
      right: 0;
      grid-template-columns: 1fr;
      background: #130f0b;
    }

    .spread::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.17), transparent 11%, transparent 89%, rgba(0, 0, 0, 0.11)),
        linear-gradient(90deg, transparent calc(50% - 1px), rgba(0, 0, 0, 0.28) 50%, transparent calc(50% + 1px));
      mix-blend-mode: multiply;
    }

    .spread.cover::after {
      background: linear-gradient(90deg, rgba(0, 0, 0, 0.16), transparent 16%, transparent 88%, rgba(0, 0, 0, 0.1));
    }

    .page {
      position: relative;
      min-width: 0;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #fff;
    }

    .page:first-child {
      box-shadow: -20px 0 28px rgba(0, 0, 0, 0.08) inset;
    }

    .page:last-child {
      box-shadow: 20px 0 28px rgba(0, 0, 0, 0.08) inset;
    }

    .page.blank {
      background:
        linear-gradient(135deg, rgba(0, 0, 0, 0.05), transparent 38%),
        #fafafa;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .split-page {
      background-repeat: no-repeat;
      background-size: 200% 100%;
    }

    .ending-card {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #120d0a;
      color: #1a120d;
    }

    .ending-card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ending-copy {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 33%;
      min-height: 34%;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: clamp(10px, 2vh, 18px);
      padding: clamp(12px, 2.4vw, 28px);
      text-align: center;
    }

    .ending-copy h2 {
      margin: 0;
      font-size: clamp(28px, 5vw, 62px);
      line-height: 1.05;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .ending-copy p {
      margin: 0;
      color: #4c4034;
      font-size: clamp(13px, 1.6vw, 18px);
      line-height: 1.7;
      font-weight: 700;
    }

    .ending-link {
      max-width: 100%;
      min-height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid rgba(26, 18, 13, 0.25);
      border-radius: 8px;
      padding: 0 16px;
      background: #2d7a58;
      color: #f7fff9;
      text-decoration: none;
      font-size: clamp(13px, 1.4vw, 16px);
      font-weight: 850;
      overflow-wrap: anywhere;
      box-shadow: 0 12px 24px rgba(26, 18, 13, 0.18);
    }

    .nav {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .nav-button {
      min-height: 54px;
      font-weight: 760;
      font-size: clamp(16px, 2vw, 20px);
    }

    .nav-button.forward {
      background: linear-gradient(180deg, var(--accent), #159061);
      color: #061710;
      border-color: transparent;
    }

    .status {
      position: fixed;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%);
      max-width: min(92vw, 760px);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(32, 32, 32, 0.94);
      color: var(--text);
      padding: 10px 14px;
      box-shadow: 0 14px 38px var(--shadow);
    }

    .status[hidden] {
      display: none;
    }

    @media (max-width: 760px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: space-between;
      }

      .stage {
        min-height: 64vh;
      }

      .book {
        width: min(94vw, calc(64vh * 1.42));
        height: min(64vh, calc(94vw / 1.42));
      }

      .book.ending-book {
        width: min(88vw, calc(72vh * 0.67));
        height: min(72vh, calc(88vw / 0.67));
      }

      .ending-copy {
        left: 7%;
        right: 7%;
        top: 32%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 id="title"></h1>
      <div class="actions">
        <div id="counter" class="counter"></div>
        <button id="pdfButton" class="pdf-button" type="button">PDF化</button>
      </div>
    </header>

    <section class="stage" aria-live="polite">
      <div class="book">
        <div id="spread" class="spread"></div>
      </div>
    </section>

    <nav class="nav" aria-label="ページ操作">
      <button id="forwardButton" class="nav-button forward" type="button">左に進む</button>
      <button id="backButton" class="nav-button" type="button">右に戻る</button>
    </nav>
  </main>

  <div id="status" class="status" hidden></div>

  <script>
    const MANGA = {
      title: "陽一パペットランド 最終話",
      images: [
              "mangaimage (0.1).jpg",
              "mangaimage (1).jpg",
              "mangaimage (2).jpg",
              "mangaimage (3).jpg",
              "mangaimage (4).jpg",
              "mangaimage (5).jpg",
              "mangaimage (6).jpg",
              "mangaimage (7).jpg",
              "mangaimage (8).jpg",
              "mangaimage (9).jpg",
              "mangaimage (10).jpg",
              "mangaimage (11).jpg",
              "mangaimage (12).jpg",
              "mangaimage (13).jpg",
              "mangaimage (14).jpg",
              "mangaimage (15).jpg",
              "mangaimage (16).jpg",
              "mangaimage (17).jpg",
              "mangaimage (18).jpg",
              "mangaimage (19).jpg",
              "mangaimage (20).jpg",
              "mangaimage (21).jpg",
              "mangaimage (22).jpg",
              "mangaimage (23).jpg",
              "mangaimage (24).jpg",
              "mangaimage (25).jpg",
              "mangaimage (26).jpg",
              "mangaimage (27).jpg",
              "mangaimage (29).jpg",
              "mangaimage (30).jpg",
              "mangaimage (31).jpg",
              "mangaimage (32).jpg",
              "mangaimage (33).jpg",
              "mangaimage (34).jpg",
              "mangaimage (35).jpg"
      ]
    };

    const title = document.querySelector("#title");
    const counter = document.querySelector("#counter");
    const spread = document.querySelector("#spread");
    const book = document.querySelector(".book");
    const forwardButton = document.querySelector("#forwardButton");
    const backButton = document.querySelector("#backButton");
    const pdfButton = document.querySelector("#pdfButton");
    const status = document.querySelector("#status");
    const SURVEY_URL = "https://sekisuihouse.github.io/youitipapetland/survey/";
    const ENDING_IMAGE = "../assets/ending-thanks.jpg";

    let pages = [];
    let spreadIndex = 0;

    title.textContent = MANGA.title;
    document.title = MANGA.title;

    init();

    forwardButton.addEventListener("click", () => goTo(spreadIndex + 1, "forward"));
    backButton.addEventListener("click", () => goTo(spreadIndex - 1, "back"));
    pdfButton.addEventListener("click", exportPdf);
    spread.addEventListener("click", (event) => {
      if (event.target.closest("a")) return;
      const rect = spread.getBoundingClientRect();
      const leftSide = event.clientX - rect.left < rect.width / 2;
      if (leftSide) {
        goTo(spreadIndex + 1, "forward");
      } else {
        goTo(spreadIndex - 1, "back");
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") goTo(spreadIndex + 1, "forward");
      if (event.key === "ArrowRight") goTo(spreadIndex - 1, "back");
    });

    async function init() {
      pages = await loadExistingImages(MANGA.images);
      render();
      if (pages.length !== MANGA.images.length) {
        showStatus(`画像リストから ${MANGA.images.length - pages.length} 枚を除外して詰めました。`);
      }
    }

    function loadExistingImages(names) {
      return Promise.all(names.map((name) => new Promise((resolve) => {
        const img = new Image();
        img.addEventListener("load", () => resolve({
          name,
          src: encodeURI(name),
          width: img.naturalWidth,
          height: img.naturalHeight
        }));
        img.addEventListener("error", () => resolve(null));
        img.src = encodeURI(name);
      }))).then((loaded) => loaded.filter(Boolean));
    }

    function render() {
      const spreadCount = getSpreadCount();
      spreadIndex = Math.min(spreadIndex, spreadCount - 1);
      book.className = isEndingIndex(spreadIndex) ? "book ending-book" : "book";
      spread.className = `spread ${isEndingIndex(spreadIndex) ? "ending" : isSinglePageIndex(spreadIndex) ? "cover" : ""}`;
      spread.innerHTML = spreadMarkup(spreadIndex);
      counter.textContent = pages.length ? spreadLabel(spreadIndex) : "0 / 0";
      forwardButton.disabled = !pages.length || spreadIndex >= spreadCount - 1;
      backButton.disabled = !pages.length || spreadIndex <= 0;
      pdfButton.disabled = !pages.length;
    }

    function getSpreadCount() {
      return Math.max(1, pages.length + 1);
    }

    function isEndingIndex(index) {
      return pages.length > 0 && index === pages.length;
    }

    function isSinglePageIndex(index) {
      if (isEndingIndex(index)) return true;
      const page = pages[index];
      return !page || page.width <= page.height;
    }

    function spreadLabel(index) {
      if (isEndingIndex(index)) return "END";
      const total = pages.reduce((sum, page, pageIndex) => sum + (isSinglePageIndex(pageIndex) ? 1 : 2), 0);
      const start = pages.slice(0, index).reduce((sum, page, pageIndex) => sum + (isSinglePageIndex(pageIndex) ? 1 : 2), 1);
      if (isSinglePageIndex(index)) return `${start} / ${total}`;
      return `${start}-${start + 1} / ${total}`;
    }

    function spreadMarkup(index) {
      if (isEndingIndex(index)) return endingMarkup();
      if (isSinglePageIndex(index)) return pageMarkup(pages[index]);
      return splitPageMarkup(pages[index], "left") + splitPageMarkup(pages[index], "right");
    }

    function endingMarkup() {
      return `<div class="ending-card"><img src="${ENDING_IMAGE}" alt="読んでくれてありがとう！！"><div class="ending-copy"><h2>読んでくれてありがとう！！</h2><p>最後まで読んだ感想を、アンケートで教えてください。</p><a class="ending-link" href="../survey/">アンケートへ<br>${SURVEY_URL}</a></div></div>`;
    }

    function pageMarkup(page) {
      if (!page) return `<div class="page blank" aria-hidden="true"></div>`;
      return `<div class="page"><img src="${page.src}" alt="${escapeHtml(page.name)}"></div>`;
    }

    function splitPageMarkup(page, side) {
      if (!page) return `<div class="page blank" aria-hidden="true"></div>`;
      const position = side === "left" ? "left center" : "right center";
      const label = side === "left" ? "left page" : "right page";
      return `<div class="page split-page" role="img" aria-label="${escapeHtml(page.name)} ${label}" style="background-image: url('${page.src}'); background-position: ${position};"></div>`;
    }

    function goTo(nextIndex, direction) {
      const spreadCount = getSpreadCount();
      if (nextIndex < 0 || nextIndex >= spreadCount || nextIndex === spreadIndex) return;

      spreadIndex = nextIndex;
      render();
    }

    async function exportPdf() {
      if (!pages.length) return;
      pdfButton.disabled = true;
      showStatus("PDFを作成しています...");

      try {
        const entries = [];
        for (let index = 0; index < pages.length; index += 1) {
          showStatus(`PDFを作成しています... ${index + 1} / ${pages.length}`);
          if (isSinglePageIndex(index)) {
            entries.push(await imageToJpegEntry(pages[index]));
          } else {
            entries.push(await imageToJpegEntry(pages[index], "right"));
            entries.push(await imageToJpegEntry(pages[index], "left"));
          }
        }
        const pdf = buildPdf(entries);
        const link = document.createElement("a");
        link.href = URL.createObjectURL(pdf);
        link.download = `${safeFileName(MANGA.title)}.pdf`;
        document.body.append(link);
        link.click();
        link.remove();
        window.setTimeout(() => URL.revokeObjectURL(link.href), 1200);
        showStatus("PDFを保存しました。");
      } catch (error) {
        console.error(error);
        showStatus("PDF化に失敗しました。ブラウザで画像の読み込みを許可してから再試行してください。");
      } finally {
        pdfButton.disabled = false;
        render();
      }
    }

    function imageToJpegEntry(page, side = "full") {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.addEventListener("load", () => {
          const sourceX = side === "right" ? Math.floor(img.naturalWidth / 2) : 0;
          const sourceWidth = side === "full" ? img.naturalWidth : Math.floor(img.naturalWidth / 2);
          const canvas = document.createElement("canvas");
          canvas.width = sourceWidth;
          canvas.height = img.naturalHeight;
          const context = canvas.getContext("2d");
          context.fillStyle = "#fff";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(img, sourceX, 0, sourceWidth, img.naturalHeight, 0, 0, canvas.width, canvas.height);
          const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
          resolve({
            width: canvas.width,
            height: img.naturalHeight,
            bytes: base64ToBytes(dataUrl.split(",")[1])
          });
        });
        img.addEventListener("error", reject);
        img.src = page.src;
      });
    }

    function buildPdf(entries) {
      const encoder = new TextEncoder();
      const chunks = [];
      const offsets = [0];
      let length = 0;
      let objectNumber = 1;
      const objects = [];
      const pageRefs = [];

      function pushText(text) {
        const bytes = encoder.encode(text);
        chunks.push(bytes);
        length += bytes.length;
      }

      function pushBytes(bytes) {
        chunks.push(bytes);
        length += bytes.length;
      }

      function addObject(writer) {
        const number = objectNumber;
        objectNumber += 1;
        objects.push({ number, writer });
        return number;
      }

      const catalogRef = addObject(() => "<< /Type /Catalog /Pages 2 0 R >>");
      const pagesRef = addObject(() => `<< /Type /Pages /Kids [${pageRefs.map((ref) => `${ref} 0 R`).join(" ")}] /Count ${pageRefs.length} >>`);

      entries.forEach((entry, index) => {
        const pageWidth = Math.round(entry.width * 0.75);
        const pageHeight = Math.round(entry.height * 0.75);
        const imageRef = addObject(() => ({
          header: `<< /Type /XObject /Subtype /Image /Width ${entry.width} /Height ${entry.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${entry.bytes.length} >>`,
          stream: entry.bytes
        }));
        const content = `q\n${pageWidth} 0 0 ${pageHeight} 0 0 cm\n/Im${index + 1} Do\nQ\n`;
        const contentBytes = encoder.encode(content);
        const contentRef = addObject(() => ({
          header: `<< /Length ${contentBytes.length} >>`,
          stream: contentBytes
        }));
        const pageRef = addObject(() => `<< /Type /Page /Parent ${pagesRef} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /XObject << /Im${index + 1} ${imageRef} 0 R >> >> /Contents ${contentRef} 0 R >>`);
        pageRefs.push(pageRef);
      });

      pushText("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
      objects.sort((a, b) => a.number - b.number).forEach((object) => {
        offsets[object.number] = length;
        pushText(`${object.number} 0 obj\n`);
        const body = object.writer();
        if (typeof body === "string") {
          pushText(`${body}\nendobj\n`);
        } else {
          pushText(`${body.header}\nstream\n`);
          pushBytes(body.stream);
          pushText("\nendstream\nendobj\n");
        }
      });

      const xrefOffset = length;
      pushText(`xref\n0 ${objectNumber}\n`);
      pushText("0000000000 65535 f \n");
      for (let index = 1; index < objectNumber; index += 1) {
        pushText(`${String(offsets[index]).padStart(10, "0")} 00000 n \n`);
      }
      pushText(`trailer\n<< /Size ${objectNumber} /Root ${catalogRef} 0 R >>\nstartxref\n${xrefOffset}\n%%EOF\n`);

      return new Blob(chunks, { type: "application/pdf" });
    }

    function base64ToBytes(base64) {
      const binary = atob(base64);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    function showStatus(message) {
      status.textContent = message;
      status.hidden = false;
      window.clearTimeout(showStatus.timer);
      showStatus.timer = window.setTimeout(() => {
        status.hidden = true;
      }, 3200);
    }

    function safeFileName(value) {
      return value.trim().replace(/[\\/:*?"<>|]+/g, "_").replace(/\s+/g, "_") || "manga";
    }

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[char]);
    }
  </script>
</body>
</html>
