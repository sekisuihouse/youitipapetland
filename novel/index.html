<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陽一パペットランド 小説リーダー</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f0e8;
      --paper: #fffdf7;
      --ink: #1f1b18;
      --muted: #746a5c;
      --line: #d6cdbc;
      --accent: #2f7d61;
      --accent-ink: #f8fff9;
      --shadow: rgba(47, 37, 24, 0.16);
      --font-size: 18px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    }

    button, select { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px clamp(12px, 3vw, 28px);
      border-bottom: 1px solid var(--line);
      background: rgba(244, 240, 232, 0.94);
      backdrop-filter: blur(14px);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .brand {
      min-width: 0;
      display: grid;
      gap: 3px;
    }

    .brand-title {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(17px, 2.2vw, 24px);
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.2;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .story-select, .control-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }

    .story-select {
      max-width: min(54vw, 320px);
      padding: 0 34px 0 10px;
    }

    .control-button {
      min-width: 38px;
      padding: 0 12px;
      cursor: pointer;
    }

    .control-button:hover, .story-select:hover { border-color: var(--accent); }

    .control-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
    }

    .reader-shell {
      min-width: 0;
      min-height: 0;
      padding: clamp(14px, 3vw, 28px);
    }

    .reader {
      position: relative;
      height: calc(100vh - 92px - clamp(28px, 6vw, 56px));
      min-height: 460px;
      overflow-x: auto;
      overflow-y: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(47, 37, 24, 0.055) 1px, transparent 1px) 0 0 / 2.15em 100%,
        var(--paper);
      box-shadow: 0 18px 50px var(--shadow);
      scroll-behavior: smooth;
    }

    .novel {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      direction: ltr;
      min-width: 100%;
      height: 100%;
      padding: clamp(28px, 5vw, 56px) clamp(24px, 5vw, 58px);
      font-size: var(--font-size);
      line-height: 2.05;
      letter-spacing: 0;
    }

    .cover {
      height: 100%;
      display: grid;
      align-content: center;
      gap: 22px;
      padding-left: 24px;
      border-left: 1px solid var(--line);
      margin-left: 28px;
    }

    .series {
      margin: 0;
      font-size: clamp(25px, 4vh, 42px);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .episode {
      margin: 0;
      color: var(--muted);
      font-size: clamp(18px, 2.6vh, 27px);
      line-height: 1.4;
      font-weight: 500;
    }

    .meta {
      color: var(--muted);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 12px;
      line-height: 1.4;
      writing-mode: horizontal-tb;
      align-self: end;
      justify-self: start;
    }

    .body {
      height: 100%;
      max-height: 100%;
    }

    .body p {
      margin: 0 0 0 1.15em;
      break-inside: avoid;
      white-space: pre-wrap;
    }

    .body p.dialogue, .body p.short-line { margin-left: 0.82em; }

    .progress {
      position: fixed;
      right: clamp(12px, 3vw, 26px);
      bottom: 12px;
      z-index: 5;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 253, 247, 0.88);
      color: var(--muted);
      font: 12px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      backdrop-filter: blur(10px);
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr;
        align-items: stretch;
      }

      .controls { justify-content: flex-start; }

      .story-select {
        flex: 1 1 180px;
        max-width: none;
      }

      .reader {
        height: calc(100vh - 148px - clamp(28px, 6vw, 56px));
        min-height: 390px;
      }

      .novel { line-height: 1.9; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-title" id="displayTitle">陽一パペットランド</h1>
        <div class="brand-subtitle" id="displayEpisode">第一話「本日の主役」</div>
      </div>
      <div class="controls" aria-label="小説リーダー操作">
        <select class="story-select" id="storySelect" aria-label="読む話を選択"></select>
        <button class="control-button" id="smallerButton" type="button" aria-label="文字を小さく">小</button>
        <button class="control-button" id="largerButton" type="button" aria-label="文字を大きく">大</button>
        <button class="control-button primary" id="startButton" type="button">冒頭へ</button>
      </div>
    </header>

    <main class="reader-shell">
      <section class="reader" id="reader" aria-live="polite">
        <article class="novel" id="novel"></article>
      </section>
    </main>
  </div>
  <div class="progress" id="progress">1 / 3</div>

n\nいちに、いちに、糸を張れ\nさんし、さんし、首を振れ\n笑っていれば大丈夫\n逃げた主役は、吊られます\n\n生糸が振り返り、指先の糸を放つ。\n\n追ってくる手のいくつかが絡まり、転んだ人形たちがまとめて倒れる。\n\n代役は走りながら叫んだ。\n\n「僕、どこに行けばいいの！？」\n\n陽一は叫び返した。\n\n「知らん！」\n\n「じゃあなんで僕も走ってるの！？」\n\n「お前が決めろ！」\n\n代役は一瞬だけ黙った。\n\nそして、額の赤い糸を押さえながら言った。\n\n「じゃあ、走る！」\n\n「いいぞ！」\n\n路地の奥に、古い扉が見えた。\n\n扉には看板がかかっている。\n\n小道具室\n関係者以外立入禁止\n主役は特に禁止\n\n陽一は笑った。\n\n「絶対ここだ」\n\n案内役が悲鳴のような声を上げる。\n\n「そこだけはなりません！　そこは物語の外側です！」\n\n陽一は扉に体当たりした。\n\n扉は思ったより簡単に開いた。\n\n三人は小道具室へ転がり込む。\n\n中は真っ暗だった。\n\n埃っぽい匂い。\n古い木材の匂い。\n布の匂い。\n\nそして、たくさんのものがあった。\n\n王冠。\n剣。\n壊れた翼。\n血のついた造花。\n誰かの名前が書かれた仮面。\n赤ん坊用の小さな棺桶。\nまだ使われていない涙の瓶。\n\n陽一は息を整えながら言った。\n\n「なんだここ……」\n\n生糸がゆっくり周囲を見回す。\n\n「物語に使われるはずだったものが置かれてる場所」\n\n代役が仮面を一つ拾った。\n\n「使われなかった役？」\n\n生糸はうなずいた。\n\n「たぶん」\n\nそのとき、小道具室の奥から、誰かの声がした。\n\n「やっと来た」\n\n陽一は身構えた。\n\n暗闇の中で、椅子が一つ揺れている。\n\nぎい。\nぎい。\n\n椅子に座っていたのは、古びた王様の人形だった。\n\n頭には傾いた王冠。\n片目は取れていて、胸には大きな穴が空いている。\n\n王様の人形は、残った片目で陽一を見た。\n\n「お前が、今度の主役か」\n\n陽一は言った。\n\n「たぶん。嫌だけど」\n\n王様は、かすれた声で笑った。\n\n「嫌ならいい。嫌がる主役ほど、幕を破れる」\n\n「お前、誰？」\n\n王様の人形は、自分の胸の穴に指を入れた。\n\nそこから、くしゃくしゃになった古い紙を取り出す。\n\nそれは台本の切れ端だった。\n\n表紙には、かすれた文字でこう書かれていた。\n\n第一代主役\n\n陽一の背筋が冷えた。\n\n「最初の……主役？」\n\n王様はうなずいた。\n\n「昔、私もこの舞台を壊そうとした」\n\n「どうなった？」\n\n王様は笑った。\n\n「見ての通りだ」\n\n胸の穴の奥で、切れた糸が揺れていた。\n\n生糸が一歩下がる。\n\n「この人、まだ生きてるの？」\n\n王様は言った。\n\n「生きてはいない。終わり損ねているだけだ」\n\n小道具室の外で、何かが扉を叩いた。\n\nどん。\nどん。\nどん。\n\n案内役の声が響く。\n\n「陽一様。開けてください。第二幕はまだ終わっておりません」\n\n王様は陽一を見た。\n\n「時間がない」\n\n「何をすればいい」\n\n「中央広場へ行け」\n\n陽一は顔をしかめた。\n\n「いや、そこ行けって敵も言ってたぞ」\n\n「敵が行けと言う場所には、たしかに罠がある」\n\n王様は続けた。\n\n「だが、舞台の中心には必ず幕を吊るす柱がある。そこを折れば、第二幕は崩れる」\n\n「つまり、罠に行って柱を折る？」\n\n「そうだ」\n\n「嫌すぎる」\n\n王様はくしゃくしゃの紙を陽一に渡した。\n\n「これを持っていけ」\n\n陽一が受け取ると、それは台本ではなく、白紙だった。\n\n「何も書いてない」\n\n「だからいい」\n\n王様は言った。\n\n「書かれたものは操られる。白紙だけが、まだ迷える」\n\n外の扉がミシミシと歪む。\n\n代役が震えながら言った。\n\n「僕も行く？」\n\n陽一は代役を見た。\n\nぐるぐるの目。\n変な口。\n額の「代」と赤い蝶結び。\n\n「お前はどうしたい？」\n\n代役は黙った。\n\n誰かに命令されるのを待っている顔だった。\n\nでも、顔は変だった。\n\n変だから、少しだけ自由に見えた。\n\n代役は言った。\n\n「僕は……」\n\n扉が破られた。\n\n無数の人形の手が、小道具室になだれ込む。\n\n案内役が赤い目で叫ぶ。\n\n「主役を返せ！」\n\n陽一は白紙を握りしめた。\n\n「生糸！　代！　行くぞ！」\n\n代役が叫んだ。\n\n「代って呼んだ！？」\n\n い返したかった。\n\nでも、言葉が出なかった。\n\n反抗しても、それすら役にされる。\n\n叫んでも、叫ぶ役にされる。\n\n逃げても、逃げる役にされる。\n\nなら、どうすればいい？\n\nそのとき、白い世界に、変な声が響いた。\n\n「陽一ー！」\n\n代の声だった。\n\n「この柱、舐めたら苦い！」\n\n陽一は目を見開いた。\n\n「は？」\n\n白い世界に、ひびが入った。\n\n糸繰り師の声が少し乱れる。\n\n「……何をしている？」\n\n代の声は続いた。\n\n「いや、なんか暇だったから！」\n\n陽一は思わず吹き出した。\n\n「何やってんだあいつ」\n\nさらに、生糸の声が聞こえた。\n\n「代、舐めないで。たぶん呪いとかある」\n\n「もう舐めた！」\n\n「遅い」\n\n白い世界のひびが、さらに広がった。\n\n陽一の体に絡みついていた糸が、少し緩む。\n\n糸繰り師が低く言った。\n\n「邪魔をするな」\n\n陽一は笑った。\n\nさっきまで重かった胸が、少しだけ軽くなった。\n\nそうだ。\n\n自分だけで考えると、全部わからなくなる。\n\n自分が自分の性質に操られているのか。\n自由なのか。\n役なのか。\n本当の自分なのか。\n\nそんなこと、一人で考えると底なし沼になる。\n\nでも、外から「柱を舐めたら苦い」とか言われると、どうでもよくなる瞬間がある。\n\n陽一は本を見た。\n\nそこには、まだ自分の説明が並んでいる。\n\n間違ってはいないのかもしれない。\n\nでも、全部ではない。\n\n陽一は手を伸ばした。\n\n本のページを破ろうとした。\n\nしかし、指が止まる。\n\n破ったら、それも「台本を破る者」になる気がした。\n\n陽一は考えた。\n\n三秒くらい。\n\nそれから、本を閉じた。\n\n糸繰り師が言った。\n\n「読まないのか」\n\n「読んだら腹立つ」\n\n「真実から目を背ける？」\n\n「違う」\n\n陽一は本を小脇に抱えた。\n\n「あとで読む」\n\n白い世界が、ぴたりと止まった。\n\n糸繰り師も黙った。\n\n陽一は言った。\n\n「今は忙しい。あとで読む。たぶん。気が向いたら。もしかしたら読まない」\n\n「それは……逃避だ」\n\n「そうかもな」\n\n陽一はにやっと笑った。\n\n「でも、今逃げるのは正解だろ」\n\n本が震えた。\n\n白い世界の糸が、ぶちぶちと切れ始める。\n\n糸繰り師の声に、初めて苛立ちが混じった。\n\n「陽一。君はなぜ、結論を拒む」\n\n「結論にされるのが嫌だから」\n\n「人は、自分を知るべきだ」\n\n「知るのはいい」\n\n陽一は白い世界のひびへ向かって走った。\n\n「でも、お前に完成させられるのは嫌だ！」\n\nひびを蹴る。\n\n世界が割れた。\n\n音が戻ってきた。\n\n拍手。\n歌。\n悲鳴。\n木の軋み。\n生糸の声。\n代の叫び。\n\n陽一は広場に戻っていた。\n\n糸繰り師の指は、まだ彼の肩に触れている。\n\nだが陽一の腕には、白い世界から持ち帰った本が抱えられていた。\n\n案内役が叫んだ。\n\n「台本内精神空間からの物品持ち出しは禁止です！」\n\n「知るか！」\n\n陽一は本を案内役に投げつけた。\n\n本は案内役の顔面に直撃した。\n\nかこん。\n\n案内役は後ろに倒れた。\n\n「雑すぎます……」\n\n代が歓声を上げた。\n\n「陽一！　戻ってきた！」\n\n陽一は代を見た。\n\n「お前、柱舐めたの？」\n\n「うん！」\n\n「苦かった？」\n\n「苦かった！」\n\n「だろうな！」\n\n生糸が陽一のそばに駆け寄る。\n\n「大丈夫？」\n\n「微妙」\n\n「正直」\n\n「でも、動ける」\n\n陽一は柱を見上げた。\n\n糸繰り師の影が、さっきより大きくなっている。\n\n怒っている。\n\n空の糸が、ぎちぎちと音を立てて引き絞られていた。\n\n「陽一」\n\n糸繰り師の声は低かった。\n\n「君は自分の本を持ち出した。それは重いぞ」\n\n陽一は足元を見た。\n\n確かに、さっき投げた本は消えていない。\n案内役のそばに落ちている。\n\n表紙の「陽一」という文字が、黒く光っていた。\n\n「あれ、俺の弱点アイテム？」\n\n生糸が言った。\n\n「たぶん。あの本を使われると、あなたの動きが読まれやすくなる」\n\n「じゃあ捨てたい」\n\n「でも、捨てても戻ってくると思う」\n\n「呪いの装備かよ」\n\n代が本を拾おうとした。\n\n生糸が叫ぶ。\n\n「触っちゃだめ！」\n\nだが遅かった。\n\n代の指が本に触れた瞬間、本の表紙が変わった。\n\n陽一\n\nその文字が、ぐにゃりと歪む。\n\nそして、新しい文字になった。\n\n代\n\n代は固まった。\n\n「僕の……本？」\n\n本が勝手に開く。\n\n白紙だった。\n\n一行だけ、黒い文字が浮かんでいる。\n\n君は、まだ何者でもない。\n\n代は、その文字を見つめた。\n\n陽一は言った。\n\n「いいじゃん」\n\n代が振り向く。\n\n「え？」\n\n「何者でもないって、まだ何にでもなれるっぽいじゃん」\n\n代は本を抱えた。\n\n「怖いよ」\n\n「だろうな」\n\n「何になればいいかわからない」\n\n「じゃあ、とりあえず柱を舐めたやつでいいんじゃね」\n\n「それは嫌」\n\n「じゃあ自分で考えろ」\n\n代はむっとした。\n\n「陽一、雑すぎる」\n\n「知ってる」\n\nその瞬間、代の背中から、また一本の糸が切れた。\n\nぷつん。\n\n広場の柱が、大きく揺れた。\n\n糸繰り師の影が叫ぶ。\n\n「未定義の存在を増やすな！」\n\n「効いてる効いてる！」\n\n陽一は柱へ向かって走った。\n\n白い線が足元から飛び出してくる。\n\nだが、代が自分の本を広げた。\n\n白紙のページが光る。\n\n白い線は、そのページに吸い込まれた。\n\n「え、何今の！」\n\n代自身が一番驚いていた。\n\n生糸が言った。\n\n「白紙は、決まった道を飲み込めるんだ」\n\n陽一は叫んだ。\n\n「代！　それ便利！　もっとやれ！」\n\n「やり方わかんない！」\n\n「気合い！」\n\n「雑！」\n\nそれでも代は本を広げた。\n\n白い線が次々に吸い込まれていく。\n\n陽一は柱の根元までたどり着いた。\n\n柱には無数の名前が彫られている。\n\nその中に、自分の名前がある。\n\n陽一。\n\n陽一役。\n\n陽一失敗。\n\n陽一修正済。\n\n陽一は、近くに落ちていた小道具の剣を拾った。\n\n刃は銀色に光っている。\n\nでも、持った瞬間わかった。\n\nこれは本物の剣じゃない。\n\n舞台用だ。\n\n軽くて、安っぽくて、たぶん折れる。\n\n陽一は笑った。\n\n「ちょうどいい」\n\n糸繰り師が言った。\n\n「それで柱は折れない」\n\n「だろうな」\n\n陽一は剣を振り上げた。\n\n柱ではなく、自分の名前に向かって。\n\n「陽一！」\n\n生糸が叫んだ。\n\n陽一は柱に彫られた「陽一修正済」の文字を、剣で思いきり削った。\n\nがりっ。\n\n剣の刃が欠けた。\n\nだが、文字の一部も削れた。\n\n柱全体が悲鳴を上げた。\n\n町の人形たちが一斉に口を開く。\n\n「あああああああああ」\n\n笑顔のまま叫んでいる。\n\n陽一はもう一度剣を振る。\n\n「俺を勝手に修正すんな！」\n\nがりっ。\n\n「失敗扱いすんな！」\n\nがりっ。\n\n「役にすんな！」\n\nがりっ。\n\n剣が折れた。\n\nでも、「陽一修正済」の文字は、ほとんど読めなくなっていた。\n\n柱から黒い液体がにじむ。\n\n生糸が指先の糸を飛ばし、その傷口に絡ませた。\n\n「陽一、そこ！」\n\n「何すればいい！」\n\n「引っ張って！」\n\n「了解！」\n\n陽一は生糸の糸を掴んだ。\n\n二人で引く。\n\n柱の表面が、べりべりと剥がれた。\n\nその下から、別の名前が現れた。\n\n生糸。\n\n陽一は息を呑んだ。\n\n生糸の名前も、柱に彫られていた。\n\n生糸\n糸を操る少女\n役割：主役を導き、最後に捕らわれる\n\n生糸の顔が青ざめる。\n\n「やっぱり……」\n\n糸繰り師が笑った。\n\n「君も役だよ、生糸。逃げられると思っていたのかい？」\n\n生糸の指が震えた。\n\n彼女の糸が、力を失って垂れる。\n\n「私は……ずっと……」\n\n陽一は、折れた剣を握り直した。\n\n「生糸」\n\n彼女は顔を上げる。\n\n陽一は言った。\n\n「これ、削っていい？」\n\n生糸は一瞬、ぽかんとした。\n\n「え？」\n\n「人の名前だから、一応聞いた」\n\n生糸の目が揺れた。\n\nそれから、彼女は少しだけ笑った。\n\n「削って」\n\n「了解」\n\n陽一は折れた剣で、生糸の役割を削った。\n\nがりっ。\n\n主役を導き、\n\nがりっ。\n\n最後に捕らわれる\n\nがりっ。\n\n文字が崩れる。\n\n生糸の背中から、何本もの糸が切れた。\n\nぷつん。\nぷつん。\nぷつん。\n\n彼女は膝をつきそうになった。\n\n陽一が支える。\n\n「大丈夫か？」\n\n生糸は息を震わせた。\n\n「軽い」\n\n「よかったじゃん」\n\n「でも、怖い」\n\n「それはたぶん、ちゃんと自由っぽい」\n\n生糸は陽一を見た。\n\nそして、初めてはっきり笑った。\n\n「雑だけど、嫌いじゃない」\n\nその瞬間、柱に大きな亀裂が入った。\n\n糸繰り師の影が膨れ上がる。\n\n「やめろ」\n\n空から無数の糸が降ってきた。\n\n町中の人形たちが、一斉に広場へなだれ込む。\n\n案内役が片腕を引きずりながら叫ぶ。\n\n「第二幕崩壊危険！　全役者、主役を拘束！」\n\n代が本を広げる。\n\n白紙が光る。\n\nでも、押し寄せる糸の数が多すぎた。\n\n「無理！　多い！」\n\n生糸が立ち上がる。\n\n「私が止める」\n\n陽一は言った。\n\n「捕らわれるなよ」\n\n「もう、その役は削った」\n\n生糸は指を広げた。\n\n彼女の糸が、今までよりずっと自由に伸びた。\n\n細く、白く、光る糸。\n\nそれは降ってくる黒い糸と絡み合い、結び目を作り、ほどき、また結ぶ。\n\nまるで、空中で誰かが新しい模様を編んでいるみたいだった。\n\n生糸は叫んだ。\n\n「陽一！　柱の中心！」\n\n「どうやって！」\n\n「名前の下に、芯がある！」\n\n陽一は柱を見る。\n\n削れた名前の奥に、赤い線が見えた。\n\n心臓の血管みたいな線。\n\n陽一は折れた剣を構えた。\n\nだが、刃はもうほとんどない。\n\n「これじゃ無理だろ！」\n\nそのとき、代が走ってきた。\n\n手には自分の本。\n\n白紙のページを一枚、びりっと破った。\n\n「これ使って！」\n\n「ページ破っていいのか！？」\n\n「わかんない！」\n\n「最高！」\n\n陽一は白紙のページを受け取った。\n\nページは手の中で形を変えた。\n\n紙の刃になった。\n\n白く、薄く、頼りない。\n\nでも、鋭い。\n\n糸繰り師が叫ぶ。\n\n「白紙を刃にするな！」\n\n陽一は笑った。\n\n「言われるとやりたくなるな！」\n\n彼は柱の赤い線に向かって、白紙の刃を突き立てた。\n\n音はしなかった。\n\nただ、静かに刺さった。\n\n次の瞬間。\n\n柱の中から、声があふれ出した。\n\n「やめて」\n\n「決めて」\n\n「助けて」\n\n「名前をください」\n\n「役をください」\n\n「自由が怖い」\n\n「考えたくない」\n\n「失敗したくない」\n\n「誰か、私を動かして」\n\n陽一は手を離しそうになった。\n\n柱の中には、たくさんの声が詰まっていた。\n\n操られた人形たちの声なのか。\n役を求めて来た者たちの声なのか。\nそれとも、陽一自身の中にもある声なのか。\n\nわからなかった。\n\n白紙の刃が震える。\n\n糸繰り師の声が、今度は悲しそうに響いた。\n\n「見ただろう、陽一」\n\n「……」\n\n「彼らは糸を求めた。役を求めた。自分で歩くことに疲れた。私は奪ったのではない。与えたんだ」\n\n広場の人形たちの笑顔が、少しだけ崩れた。\n\n笑顔の奥に、疲れた顔が見えた気がした。\n\n「自由は重い。未定義は怖い。白紙は希望ではない。白紙は空白だ。空白に耐えられない者もいる」\n\n陽一は白紙の刃を握ったまま、動けなくなった。\n\n糸繰り師の言葉は、嘘だけではない気がした。\n\n全部壊せばいい。\n\nそう思っていた。\n\nでも、柱の中の声は、壊されたくないとも言っていた。\n\n「陽一！」\n\n生糸の声。\n\n「迷うなら、迷ったままやって！」\n\n陽一は振り返る。\n\n生糸は黒い糸に押されながらも、必死に立っている。\n\n「答えが出てから動いてたら、間に合わない！」\n\n代も叫んだ。\n\n「僕もまだ何者でもないけど、今はこっちがいい！」\n\n陽一は二人を見た。\n\nそして、柱を見た。\n\n「……そっか」\n\n彼は小さく言った。\n\n「白紙って、答えがないってことじゃなくて」\n\n白紙の刃を握る手に力を込める。\n\n「まだ書き直せるってことか」\n\n陽一は叫んだ。\n\n「全員、糸を切るかどうかは自分で決めろ！」\n\n白紙の刃が強く光る。\n\n「でも、勝手に役を固定する柱は邪魔だ！」\n\n彼は赤い芯を切った。\n\n今度は音がした。\n\nぶちん。\n\nそれは、巨大な糸が切れる音だった。\n\n柱に亀裂が走る。\n\n上から下へ。\n根元から空へ。\n町中へ伸びる糸が、次々に緩んでいく。\n\n人形たちは倒れなかった。\n\nただ、その場で立ち尽くした。\n\n笑顔の角度が少しずつ崩れていく。\n\nパン屋の人形が、自分の手を見た。\n\n警官の人形が、帽子を脱いだ。\n\n母親の人形が、泣いている赤ちゃんの人形を見て、本当に困った顔をした。\n\n子どもたちの歌が止まった。\n\n拍手も止まった。\n\n初めて、広場に静寂が訪れた。\n\nそして、柱が崩れた。\n\n黒い木片が、空へ向かって舞い上がる。\n\n地面に落ちるのではなく、空に吸い込まれていく。\n\n第二幕の空に、大きな穴が開いた。\n\nその向こうに、さらに大きな舞台が見えた。\n\n暗い塔。\n吊られた月。\n無数の糸が絡まる空。\n\n糸繰り師の本当の場所。\n\n案内役が、崩れた柱の前で震えていた。\n\n「第二幕……終了不能……終了不能……」\n\n陽一は息を切らしながら立っていた。\n\n白紙の刃は、手の中でただの紙に戻っている。\n\n代が自分の本を抱えて、ぽつりと言った。\n\n「僕、まだ消えてない」\n\n陽一は笑った。\n\n「よかったな」\n\n生糸は空の穴を見上げた。\n\n「でも、終わってない」\n\nその通りだった。\n\n空の向こうから、糸繰り師の声が降ってくる。\n\n今までよりも、ずっと近い。\n\n「陽一」\n\n声は静かだった。\n\n怒りも、笑いも、消えていた。\n\n「君は柱を壊した。役をほどいた。白紙を刃にした」\n\n空の穴から、一本の巨大な糸が垂れてきた。\n\n赤でも黒でもない。\n\n透明な糸。\n\n見えにくいのに、確かにそこにある。\n\n「では次に、君には見てもらおう」\n\n糸が、陽一の目の前で揺れた。\n\n「糸のない世界が、どれほど残酷かを」\n\n広場の地面が割れた。\n\n第二幕の町が、ゆっくり沈み始める。\n\n家々が傾く。\n石畳が剥がれる。\n空の絵が破れる。\n\n人形たちは叫び始めた。\n\n「どうすればいい」\n\n「次の台詞は？」\n\n「どこへ行けば？」\n\n「私の役は？」\n\n「私って、何？」\n\n陽一はその声に息を呑んだ。\n\n糸が切れた者たちは、自由になった。\n\nでも、同時に迷子になっていた。\n\n生糸が言った。\n\n「陽一、選んだ責任が来る」\n\n「重すぎるだろ」\n\n「でも、選んだ」\n\n陽一は崩れていく町を見た。\n\n自分が壊した。\n\n間違ってはいないと思う。\n\nでも、正しかったとも言い切れない。\n\n代が陽一の袖をつかんだ。\n\n「どうするの？」\n\n陽一はしばらく黙った。\n\nそれから、深く息を吸った。\n\n「わからん」\n\n生糸がうなずいた。\n\n「うん」\n\n「でも、とりあえず」\n\n陽一は、まだ立ち尽くしている町の人形たちに向かって叫んだ。\n\n「逃げたいやつは逃げろ！　残りたいやつは残れ！　決められないやつは、いったん俺らについてこい！」\n\n人形たちは、ぽかんとした。\n\n陽一は続けた。\n\n「俺もわかってない！　だから、わかってないまま動く！」\n\n沈みゆく広場に、少しずつ足音が増えた。\n\n一体。\n二体。\n十体。\n二十体。\n\n何人かは逃げ出した。\n何人かはその場に座り込んだ。\n何人かは、陽一たちの方へ歩いてきた。\n\nバラバラだった。\n\n初めて、バラバラだった。\n\n陽一はそれを見て、少しだけ笑った。\n\n「いいじゃん」\n\n生糸が言った。\n\n「めちゃくちゃだよ」\n\n「めちゃくちゃなのは、たぶん生きてる証拠だろ」\n\n代が首をかしげた。\n\n「それ、名言？」\n\n「今のはちょっと名言っぽかったな」\n\nそのとき、空の穴から、次の幕が降りてきた。\n\n真っ黒な幕。\n\nそこには白い文字で、こう書かれていた。\n\n第三幕：糸なき群れ\n\n陽一は顔をしかめた。\n\n「勝手に次回予告すんな」\n\nだが、幕は開き始めていた。\n\nその向こうに、糸繰り師の塔が見える。\n\nそして塔の前には、無数の人形ではなく、\n糸を切られた者たちが立っていた。\n\n笑っていない。\n泣いていない。\n怒っている者もいる。\n震えている者もいる。\n陽一を睨んでいる者もいる。\n\nその中心に、一人の少女がいた。\n\n赤いドレス。\n割れた仮面。\n手には、切れた糸の束。\n\n彼女は陽一を見て、静かに言った。\n\n「あなたが、私たちの役を壊したの？」\n\n陽一は返事に詰まった。\n\n少女は続けた。\n\n「じゃあ、代わりに教えて」\n\nその声は、怒りで震えていた。\n\n「私たちは、これからどう生きればいいの？」\n\n陽一は、白紙の紙を握りしめた。\n\n初めて、敵じゃないものが立ちはだかっていた。\n\n倒せばいい相手じゃない。\n\n壊せば進める壁じゃない。\n\n答えを求めてくる人たちだった。\n\n陽一は小さく言った。\n\n「うわ」\n\n生糸が隣で言った。\n\n「第三幕、始まったね」\n\n代が震えながら聞いた。\n\n「どうする？」\n\n陽一は、赤いドレスの少女を見た。\n\nそれから、崩れた柱を見た。\n\nそして、空の奥で待つ糸繰り師の塔を見上げた。\n\n「……まず」\n\n陽一は一歩前に出た。\n\n「ごめん、俺にもわからん」\n\n赤いドレスの少女の目が細くなる。\n\n陽一は続けた。\n\n「でも、わからないまま一緒に考えることはできる」\n\n拍手は、もう聞こえなかった。\n\n代わりに、ざわめきがあった。\n\n怒り。\n困惑。\n不安。\n自由。\n\nそれら全部が混ざった、本物の音だった。\n\n陽一はその音の中で、初めて舞台ではなく、世界に立っている気がした。\n\n第三話「白紙の台本」終"}]</script>
  <script>
    const novels = JSON.parse(document.getElementById('novel-data').textContent);
    const select = document.getElementById('storySelect');
    const reader = document.getElementById('reader');
    const novelEl = document.getElementById('novel');
    const titleEl = document.getElementById('displayTitle');
    const episodeEl = document.getElementById('displayEpisode');
    const progressEl = document.getElementById('progress');
    let currentIndex = 0;
    let fontSize = 18;

    function paragraphClass(text) {
      if (/^「/.test(text)) return 'dialogue';
      if (text.length <= 8) return 'short-line';
      return '';
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function render(index) {
      currentIndex = index;
      const item = novels[index];
      titleEl.textContent = item.series;
      episodeEl.textContent = item.episode;
      progressEl.textContent = String(index + 1) + ' / ' + novels.length;
      document.title = item.episode + ' - ' + item.series;

      const paragraphs = item.body
        .split(/\n{2,}/)
        .map(part => part.trim())
        .filter(Boolean);

      const bodyHtml = paragraphs.map(part => {
        const className = paragraphClass(part);
        const classAttr = className ? ' class="' + className + '"' : '';
        return '<p' + classAttr + '>' + escapeHtml(part) + '</p>';
      }).join('');

      novelEl.innerHTML =
        '<header class="cover">' +
          '<h2 class="series">' + escapeHtml(item.series) + '</h2>' +
          '<p class="episode">' + escapeHtml(item.episode) + '</p>' +
          '<div class="meta">' + escapeHtml(item.file) + '</div>' +
        '</header>' +
        '<div class="body">' + bodyHtml + '</div>';

      select.value = String(index);
      if (location.hash !== '#' + item.id) {
        history.replaceState(null, '', '#' + item.id);
      }
      requestAnimationFrame(goStart);
    }

    function goStart() {
      reader.scrollLeft = reader.scrollWidth;
    }

    novels.forEach((item, index) => {
      const option = document.createElement('option');
      option.value = String(index);
      option.textContent = item.episode + '（' + item.file + '）';
      select.appendChild(option);
    });

    select.addEventListener('change', event => render(Number(event.target.value)));
    document.getElementById('startButton').addEventListener('click', goStart);
    document.getElementById('smallerButton').addEventListener('click', () => {
      fontSize = Math.max(15, fontSize - 1);
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      goStart();
    });
    document.getElementById('largerButton').addEventListener('click', () => {
      fontSize = Math.min(24, fontSize + 1);
      document.documentElement.style.setProperty('--font-size', fontSize + 'px');
      goStart();
    });

    window.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') reader.scrollBy({ left: -reader.clientWidth * 0.85, behavior: 'smooth' });
      if (event.key === 'ArrowRight') reader.scrollBy({ left: reader.clientWidth * 0.85, behavior: 'smooth' });
      if (event.key === 'ArrowUp' && currentIndex > 0) render(currentIndex - 1);
      if (event.key === 'ArrowDown' && currentIndex < novels.length - 1) render(currentIndex + 1);
    });

    window.addEventListener('hashchange', () => {
      const hashIndex = novels.findIndex(item => '#' + item.id === location.hash);
      if (hashIndex >= 0 && hashIndex !== currentIndex) render(hashIndex);
    });

    const initialIndex = novels.findIndex(item => '#' + item.id === location.hash);
    render(initialIndex >= 0 ? initialIndex : 0);
  </script>
