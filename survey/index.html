<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>陽一パペットランド アンケート</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --paper: #fffdf8;
      --ink: #17130f;
      --muted: #70685f;
      --line: #ded6ca;
      --accent: #2d7a58;
      --accent-ink: #f7fff9;
      --shadow: rgba(43, 32, 22, 0.12);
      --tape: #b84438;
      --scroll-shift: 0px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        linear-gradient(90deg, rgba(23, 19, 15, 0.045) 1px, transparent 1px) 0 0 / 96px 100%,
        linear-gradient(180deg, rgba(23, 19, 15, 0.035) 1px, transparent 1px) 0 0 / 100% 118px,
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0)),
        var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: crosshair;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(255, 253, 248, 0.08) 1px, transparent 1px),
        #16110d;
      background-size: 18px 100%;
      transform-origin: top;
      animation: entrance-curtain 1.15s cubic-bezier(0.78, 0, 0.18, 1) forwards;
    }

    a {
      color: inherit;
    }

    .page {
      position: relative;
      z-index: 3;
      width: min(100% - 32px, 1120px);
      margin: 0 auto;
      padding: clamp(28px, 6vw, 72px) 0;
      display: grid;
      gap: clamp(28px, 5vw, 56px);
    }

    .intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, 300px);
      gap: clamp(24px, 5vw, 64px);
      align-items: end;
    }

    .copy {
      display: grid;
      gap: 20px;
      max-width: 680px;
    }

    .label {
      position: relative;
      margin: 0;
      width: fit-content;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255, 253, 248, 0.74);
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
    }

    .label::after {
      content: "";
      position: absolute;
      right: 14px;
      bottom: -8px;
      width: 32px;
      height: 9px;
      background: color-mix(in srgb, var(--tape), transparent 8%);
      transform: rotate(-4deg);
      opacity: 0.82;
    }

    .label,
    h1,
    .lead,
    .actions,
    .cover,
    .form-shell,
    footer {
      animation: entrance-rise 780ms cubic-bezier(0.2, 0.82, 0.22, 1) both;
    }

    .label {
      animation-delay: 280ms;
    }

    h1 {
      animation-delay: 380ms;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1.02;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 19px);
      line-height: 1.9;
      animation-delay: 500ms;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      animation-delay: 620ms;
    }

    .button {
      min-height: 48px;
      display: inline-grid;
      grid-auto-flow: column;
      gap: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 18px;
      background: var(--paper);
      text-decoration: none;
      font-weight: 760;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--shadow);
    }

    .button.primary {
      border-color: transparent;
      background: var(--accent);
      color: var(--accent-ink);
    }

    .button.primary::after {
      content: "";
      width: 6px;
      height: 6px;
      margin-left: 10px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.86;
      box-shadow: 9px 0 0 currentColor, 18px 0 0 currentColor;
      animation: button-dots 1.3s steps(2, end) infinite;
    }

    .cover {
      position: relative;
      margin: 0;
      justify-self: end;
      width: min(100%, 280px);
      animation-delay: 520ms;
    }

    .cover::before,
    .cover::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: -10px;
      width: 48px;
      height: 13px;
      background: color-mix(in srgb, var(--tape), transparent 8%);
      opacity: 0.88;
    }

    .cover::before {
      left: -12px;
      transform: rotate(-9deg);
    }

    .cover::after {
      right: -12px;
      transform: rotate(8deg);
    }

    .cover img {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 20px 54px var(--shadow);
      transform-origin: 50% 80%;
      animation:
        entrance-cover 980ms cubic-bezier(0.2, 0.82, 0.22, 1) 520ms both,
        cover-breathe 6.8s ease-in-out 1.8s infinite;
    }

    .form-shell {
      position: relative;
      display: grid;
      gap: 16px;
      animation-delay: 820ms;
    }

    .form-shell::before {
      content: "";
      position: absolute;
      right: clamp(10px, 6vw, 80px);
      top: -92px;
      width: clamp(84px, 12vw, 148px);
      aspect-ratio: 1;
      background: url("assets/characters/puppet-charms.png") center / contain no-repeat;
      pointer-events: none;
      filter: drop-shadow(0 14px 18px rgba(43, 32, 22, 0.12));
      opacity: 0;
      transform-origin: 50% 0;
      animation:
        entrance-rise 780ms cubic-bezier(0.2, 0.82, 0.22, 1) 1.24s both,
        sign-sway 5.4s ease-in-out 2s infinite;
    }

    .form-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .form-head h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    .form-head p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      text-align: right;
    }

    .form-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 18px 54px var(--shadow);
    }

    .form-frame::before,
    .form-frame::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 16px;
      width: 58px;
      height: 14px;
      background: color-mix(in srgb, var(--tape), transparent 10%);
      opacity: 0.86;
      pointer-events: none;
    }

    .form-frame::before {
      left: 18px;
      transform: rotate(-7deg);
    }

    .form-frame::after {
      right: 18px;
      transform: rotate(6deg);
    }

    .form-frame iframe {
      display: block;
      width: 100%;
      min-height: 1829px;
      border: 0;
      background: var(--paper);
    }

    footer {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
      animation-delay: 940ms;
    }

    .edge-stage {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
    }

    .edge-stage::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: min(42vh, 360px);
      background:
        linear-gradient(90deg, transparent 9%, rgba(23, 19, 15, 0.22) 9% 9.12%, transparent 9.12%),
        linear-gradient(90deg, transparent 37%, rgba(23, 19, 15, 0.16) 37% 37.08%, transparent 37.08%),
        linear-gradient(90deg, transparent 68%, rgba(23, 19, 15, 0.18) 68% 68.1%, transparent 68.1%),
        linear-gradient(90deg, transparent 91%, rgba(23, 19, 15, 0.2) 91% 91.12%, transparent 91.12%);
      opacity: 0.28;
      animation: string-drift 7s ease-in-out infinite;
    }

    .edge-stage::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -60px;
      width: clamp(160px, 20vw, 260px);
      aspect-ratio: 1;
      background: url("assets/characters/puppet-door.png") center / contain no-repeat;
      opacity: 0;
      filter: drop-shadow(0 20px 28px rgba(43, 32, 22, 0.15));
      transform: translateX(-50%) translateY(22px) rotate(-1deg);
      animation:
        door-enter 900ms cubic-bezier(0.2, 0.82, 0.22, 1) 1.42s both,
        door-knock 7.6s ease-in-out 2.4s infinite;
    }

    .edge-puppet {
      position: absolute;
      display: block;
      width: var(--sprite-width);
      height: auto;
      user-select: none;
      filter: drop-shadow(0 18px 20px rgba(43, 32, 22, 0.16));
      opacity: 0;
      animation:
        entrance-rise 780ms cubic-bezier(0.2, 0.82, 0.22, 1) var(--sprite-delay) both,
        var(--sprite-motion) var(--sprite-speed) ease-in-out calc(var(--sprite-delay) + 780ms) infinite;
    }

    .edge-puppet-peek {
      --sprite-width: clamp(118px, 14vw, 190px);
      --sprite-delay: 920ms;
      --sprite-motion: puppet-peek;
      --sprite-speed: 8.4s;
      right: max(-42px, -3vw);
      top: calc(clamp(108px, 18vh, 190px) + var(--scroll-shift));
      transform-origin: 88% 54%;
    }

    .edge-puppet-round {
      --sprite-width: clamp(84px, 11vw, 146px);
      --sprite-delay: 1.08s;
      --sprite-motion: puppet-bob;
      --sprite-speed: 6.8s;
      left: max(-30px, -2vw);
      bottom: clamp(34px, 8vh, 92px);
      transform-origin: 42% 90%;
    }

    .edge-puppet-sign {
      --sprite-width: clamp(116px, 13vw, 176px);
      --sprite-delay: 1.18s;
      --sprite-motion: sign-sway;
      --sprite-speed: 5.9s;
      left: clamp(14px, 4vw, 54px);
      top: clamp(270px, 47vh, 450px);
      transform-origin: 48% 4%;
      opacity: 0.9;
    }

    .sparkle-layer {
      position: fixed;
      inset: 0;
      z-index: 8;
      pointer-events: none;
      overflow: hidden;
    }

    .paper-bit {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size);
      height: calc(var(--size) * 0.58);
      border: 1px solid rgba(23, 19, 15, 0.18);
      border-radius: 2px;
      background: var(--bit-color);
      opacity: 0;
      transform: translate(-50%, -50%) rotate(var(--rot));
      animation: paper-pop 840ms cubic-bezier(0.2, 0.82, 0.22, 1) forwards;
    }

    @keyframes entrance-curtain {
      0% {
        transform: scaleY(1);
        opacity: 1;
      }

      72% {
        opacity: 1;
      }

      100% {
        transform: scaleY(0);
        opacity: 0;
      }
    }

    @keyframes entrance-rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes entrance-cover {
      from {
        opacity: 0;
        transform: translateY(20px) rotate(-2deg) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) rotate(0) scale(1);
      }
    }

    @keyframes cover-breathe {
      0%,
      100% {
        transform: translateY(0) rotate(0) scale(1);
      }

      50% {
        transform: translateY(-4px) rotate(0.6deg) scale(1.01);
      }
    }

    @keyframes puppet-peek {
      0%,
      100% {
        transform: translateX(0) rotate(-1deg);
      }

      45% {
        transform: translateX(-16px) rotate(1.4deg);
      }

      62% {
        transform: translateX(-10px) rotate(-0.8deg);
      }
    }

    @keyframes puppet-bob {
      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-12px) rotate(-2.8deg);
      }
    }

    @keyframes sign-sway {
      0%,
      100% {
        transform: rotate(-2deg);
      }

      50% {
        transform: rotate(2.6deg) translateY(4px);
      }
    }

    @keyframes string-drift {
      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(6px);
      }
    }

    @keyframes button-dots {
      0%,
      100% {
        opacity: 0.32;
      }

      50% {
        opacity: 0.9;
      }
    }

    @keyframes door-enter {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(40px) rotate(-4deg);
      }

      to {
        opacity: 0.9;
        transform: translateX(-50%) translateY(0) rotate(-1deg);
      }
    }

    @keyframes door-knock {
      0%,
      100% {
        transform: translateX(-50%) translateY(0) rotate(-1deg);
      }

      48% {
        transform: translateX(-50%) translateY(-5px) rotate(1.4deg);
      }

      52% {
        transform: translateX(-50%) translateY(-3px) rotate(-2deg);
      }
    }

    @keyframes paper-pop {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.4) rotate(var(--rot));
      }

      18% {
        opacity: 0.95;
      }

      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(calc(var(--rot) + 150deg));
      }
    }

    @media (max-width: 760px) {
      .page {
        width: min(100% - 24px, 1120px);
      }

      .intro {
        grid-template-columns: 1fr;
      }

      .cover {
        justify-self: start;
        width: min(64vw, 220px);
      }

      .form-head {
        display: grid;
      }

      .form-head p {
        text-align: left;
      }

      .edge-puppet-sign,
      .edge-puppet-round,
      .form-shell::before {
        display: none;
      }

      .edge-puppet-peek {
        --sprite-width: 104px;
        top: 104px;
        right: -76px;
      }

      .edge-stage::after {
        width: 132px;
        left: auto;
        right: -34px;
        bottom: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-delay: 0ms !important;
        scroll-behavior: auto !important;
        transition-duration: 1ms !important;
      }

      .sparkle-layer,
      .edge-stage::after,
      .form-shell::before {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="sparkle-layer" aria-hidden="true"></div>
  <div class="edge-stage" aria-hidden="true">
    <img class="edge-puppet edge-puppet-peek" src="assets/characters/puppet-peek.png" alt="">
    <img class="edge-puppet edge-puppet-round" src="assets/characters/puppet-round.png" alt="">
    <img class="edge-puppet edge-puppet-sign" src="assets/characters/puppet-sign.png" alt="">
  </div>
  <main class="page">
    <section class="intro" aria-labelledby="pageTitle">
      <div class="copy">
        <p class="label">陽一パペットランドを見た人へ</p>
        <h1 id="pageTitle">読後アンケート</h1>
        <p class="lead">陽一パペットランドを読んだあとに残った感覚、好きだった場面、気になった言葉を教えてください。短くても、そのままでも大丈夫です。</p>
        <div class="actions">
          <a class="button primary" href="#form">回答する</a>
          <a class="button" href="../all/">もう一度読む</a>
        </div>
      </div>
      <figure class="cover" aria-label="陽一パペットランドの画像">
        <img src="assets/yoichi-cover.jpg" alt="陽一パペットランド">
      </figure>
    </section>

    <section id="form" class="form-shell" aria-labelledby="formTitle">
      <div class="form-head">
        <h2 id="formTitle">アンケートフォーム</h2>
        <p>回答はGoogleフォームで送信されます。</p>
      </div>
      <div class="form-frame">
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSeARErjnPH8QTz21Q7cuRoaf14m6xI5aN90CZdjTRF5930tOg/viewform?embedded=true" width="640" height="1829" frameborder="0" marginheight="0" marginwidth="0">読み込んでいます…</iframe>
      </div>
    </section>

    <footer>
      <p>陽一パペットランドへの感想を静かに集めるためのページです。</p>
    </footer>
  </main>
  <script>
    const root = document.documentElement;
    const sparkleLayer = document.querySelector(".sparkle-layer");
    const bitColors = ["#fffdf8", "#b84438", "#2d7a58", "#17130f", "#ded6ca"];
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function updateScrollShift() {
      const shift = Math.sin(window.scrollY / 180) * 12;
      root.style.setProperty("--scroll-shift", `${shift.toFixed(2)}px`);
    }

    function scatterPaper(x, y, amount = 8) {
      if (reducedMotion || !sparkleLayer) return;

      for (let i = 0; i < amount; i += 1) {
        const bit = document.createElement("span");
        const angle = Math.random() * Math.PI * 2;
        const distance = 24 + Math.random() * 58;
        bit.className = "paper-bit";
        bit.style.setProperty("--x", `${x}px`);
        bit.style.setProperty("--y", `${y}px`);
        bit.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        bit.style.setProperty("--dy", `${Math.sin(angle) * distance - 12}px`);
        bit.style.setProperty("--rot", `${Math.random() * 180 - 90}deg`);
        bit.style.setProperty("--size", `${7 + Math.random() * 10}px`);
        bit.style.setProperty("--bit-color", bitColors[Math.floor(Math.random() * bitColors.length)]);
        sparkleLayer.append(bit);
        bit.addEventListener("animationend", () => bit.remove(), { once: true });
      }
    }

    window.addEventListener("scroll", updateScrollShift, { passive: true });
    window.addEventListener("pointerdown", (event) => scatterPaper(event.clientX, event.clientY));
    document.querySelectorAll(".button, .cover").forEach((target) => {
      target.addEventListener("pointerenter", (event) => {
        const rect = target.getBoundingClientRect();
        scatterPaper(rect.left + rect.width / 2, rect.top + rect.height / 2, 5);
      });
    });
    updateScrollShift();
  </script>
</body>
</html>
